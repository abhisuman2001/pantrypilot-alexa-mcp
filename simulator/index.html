<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PantryPilot – Alexa+ Voice Simulator</title>
  <meta name="description" content="Simulate Alexa+ voice commands for PantryPilot: manage your household pantry and get Bedrock-powered recipe suggestions by voice or text." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════════════════
       DESIGN TOKENS
    ═══════════════════════════════════════════════════════ */
    :root {
      --bg:         #060c1a;
      --bg-card:    rgba(8, 18, 45, 0.75);
      --bg-input:   rgba(255,255,255,0.06);
      --cyan:       #00d4ff;
      --cyan-dim:   rgba(0,212,255,0.12);
      --cyan-glow:  rgba(0,212,255,0.40);
      --purple:     #8b5cf6;
      --purple-dim: rgba(139,92,246,0.18);
      --green:      #22c55e;
      --red:        #ef4444;
      --text:       #e2e8f0;
      --muted:      #64748b;
      --border:     rgba(0,212,255,0.14);
      --radius:     16px;
      --radius-sm:  10px;
      --user-grad:  linear-gradient(135deg,#2563eb,#7c3aed);
      --btn-grad:   linear-gradient(135deg,var(--cyan),var(--purple));
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }

    /* Ambient background glow */
    body::before {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 5%,  rgba(0,212,255,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 85% 90%, rgba(139,92,246,0.09) 0%, transparent 60%);
    }

    /* ═══════════════════════════════════════════════════════
       LAYOUT
    ═══════════════════════════════════════════════════════ */
    .app {
      position: relative; z-index:1;
      display: grid;
      grid-template-rows: 56px 1fr auto;
      height: 100dvh;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ═══════════════════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════════════════ */
    header {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .logo { display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.05rem; letter-spacing:-0.02em; }
    .logo-icon {
      width:32px; height:32px; border-radius:8px;
      background: var(--btn-grad);
      display:flex; align-items:center; justify-content:center; font-size:1rem;
      box-shadow: 0 0 12px rgba(0,212,255,0.3);
    }
    .status { display:flex; align-items:center; gap:6px; font-size:0.76rem; color:var(--muted); }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--muted); transition:all .4s; }
    .dot.on  { background:var(--green); box-shadow:0 0 6px var(--green); }
    .dot.off { background:var(--red);   box-shadow:0 0 6px var(--red); }
    .hdr-btns { display:flex; gap:6px; }
    .ico {
      width:32px; height:32px; border-radius:var(--radius-sm);
      background:var(--bg-input); border:1px solid var(--border);
      color:var(--muted); cursor:pointer; font-size:.95rem;
      display:flex; align-items:center; justify-content:center;
      transition:all .2s;
    }
    .ico:hover { color:var(--cyan); border-color:var(--cyan); }

    /* ═══════════════════════════════════════════════════════
       MAIN
    ═══════════════════════════════════════════════════════ */
    main { display:flex; flex-direction:column; gap:10px; overflow:hidden; padding:10px 0; }

    /* ── Alexa ring ── */
    .ring-wrap { display:flex; justify-content:center; align-items:center; flex-direction:column; gap:4px; }
    .alexa-ring {
      position:relative; width:76px; height:76px;
      display:flex; align-items:center; justify-content:center;
    }
    .r-bg, .r-spin, .r-spin2 {
      position:absolute; inset:0; border-radius:50%; border:2.5px solid transparent;
    }
    .r-bg { border-color: rgba(0,212,255,0.18); }
    .r-spin {
      border-top-color:var(--cyan); border-right-color:rgba(0,212,255,0.4);
      opacity:0; transition:opacity .3s;
    }
    .r-spin2 {
      border-bottom-color:var(--purple); border-left-color:rgba(139,92,246,0.4);
      inset:8px; opacity:0; transition:opacity .3s;
    }
    .alexa-ring.listening .r-spin, .alexa-ring.speaking .r-spin   { opacity:1; animation:spin  .9s linear infinite; }
    .alexa-ring.listening .r-spin2, .alexa-ring.speaking .r-spin2 { opacity:1; animation:spin2 1.3s linear infinite; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes spin2 { to { transform: rotate(-360deg); } }
    .r-glow {
      position:absolute; inset:10px; border-radius:50%;
      background:radial-gradient(circle, var(--cyan-glow) 0%, transparent 70%);
      opacity:0; transition:opacity .4s;
    }
    .alexa-ring.listening .r-glow, .alexa-ring.speaking .r-glow {
      opacity:1; animation:pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{transform:scale(.9)} 50%{transform:scale(1.1)} }
    .r-icon { font-size:1.8rem; position:relative; z-index:1; filter:drop-shadow(0 0 8px var(--cyan)); }
    .ring-label { font-size:0.7rem; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }

    /* ── Chat ── */
    .chat {
      flex:1; min-height:0;
      overflow-y:auto; display:flex; flex-direction:column; gap:8px;
      padding-right:4px; scroll-behavior:smooth;
    }
    .chat::-webkit-scrollbar { width:3px; }
    .chat::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

    .msg { display:flex; align-items:flex-end; gap:7px; animation:fadeUp .25s ease forwards; }
    .msg.user  { justify-content:flex-end; }
    .msg.alexa { justify-content:flex-start; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

    .av {
      width:26px; height:26px; border-radius:50%; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-size:.8rem;
    }
    .msg.alexa .av { background:linear-gradient(135deg,#0ea5e9,#7c3aed); }
    .msg.user  .av { background:var(--user-grad); }

    .bubble {
      max-width:70%; padding:9px 13px; border-radius:var(--radius); font-size:.875rem; line-height:1.55;
    }
    .msg.alexa .bubble {
      background:var(--bg-card); border:1px solid var(--border);
      border-bottom-left-radius:3px; backdrop-filter:blur(14px); color:var(--text);
    }
    .msg.user .bubble {
      background:var(--user-grad); border-bottom-right-radius:3px; color:#fff;
    }
    .msg.system .bubble {
      background:rgba(0,212,255,0.06); border:1px dashed var(--border);
      color:var(--muted); font-size:.78rem; font-style:italic; margin:0 auto;
    }

    /* typing dots */
    .dots span {
      display:inline-block; width:5px; height:5px;
      background:var(--cyan); border-radius:50%; margin:0 2px;
      animation:db 1.2s ease infinite;
    }
    .dots span:nth-child(2){animation-delay:.2s} .dots span:nth-child(3){animation-delay:.4s}
    @keyframes db { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-5px)} }

    /* ── Quick actions ── */
    .actions { display:grid; grid-template-columns:repeat(3,1fr); gap:5px; }
    .qa {
      background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm);
      color:var(--text); cursor:pointer; font-family:inherit; font-size:.76rem; font-weight:500;
      padding:7px 5px; text-align:center; transition:all .18s; backdrop-filter:blur(10px);
      display:flex; flex-direction:column; align-items:center; gap:3px; user-select:none;
    }
    .qa:hover { border-color:var(--cyan); background:var(--cyan-dim); color:var(--cyan); transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,212,255,0.1); }
    .qa:active { transform:translateY(0); }
    .qa .qi { font-size:1rem; }

    /* ═══════════════════════════════════════════════════════
       BOTTOM
    ═══════════════════════════════════════════════════════ */
    .bottom { display:flex; flex-direction:column; gap:7px; padding:8px 0 10px; border-top:1px solid var(--border); }

    /* form toggles */
    .ftoggle-row { display:flex; gap:5px; }
    .ftgl {
      flex:1; background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius-sm);
      color:var(--muted); cursor:pointer; font-family:inherit; font-size:.76rem; padding:5px 8px;
      text-align:center; transition:all .18s;
    }
    .ftgl:hover,.ftgl.on { border-color:var(--cyan); color:var(--cyan); background:var(--cyan-dim); }

    /* form panel */
    .fpanel {
      display:none; flex-wrap:wrap; gap:5px;
      background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-sm);
      padding:8px; backdrop-filter:blur(12px);
    }
    .fpanel.open { display:flex; }
    .fpanel input, .fpanel select {
      flex:1; min-width:70px;
      background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius-sm);
      color:var(--text); font-family:inherit; font-size:.81rem; padding:5px 9px; outline:none;
      transition:border-color .2s;
    }
    .fpanel input:focus, .fpanel select:focus { border-color:var(--cyan); }
    .fpanel input::placeholder { color:var(--muted); }
    .fsbmt {
      background:var(--btn-grad); border:none; border-radius:var(--radius-sm);
      color:#fff; cursor:pointer; font-family:inherit; font-size:.81rem; font-weight:600;
      padding:5px 14px; transition:opacity .2s;
    }
    .fsbmt:hover { opacity:.85; }

    /* input bar */
    .ibar { display:flex; gap:7px; align-items:center; }
    #cmd {
      flex:1; background:var(--bg-input); border:1px solid var(--border); border-radius:24px;
      color:var(--text); font-family:inherit; font-size:.875rem; padding:9px 16px; outline:none;
      transition:border-color .2s, box-shadow .2s;
    }
    #cmd:focus { border-color:var(--cyan); box-shadow:0 0 0 3px var(--cyan-dim); }
    #cmd::placeholder { color:var(--muted); }
    .ibtn {
      width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center; font-size:1.05rem;
      flex-shrink:0; transition:all .18s;
    }
    #send-btn { background:var(--btn-grad); color:#fff; }
    #send-btn:hover { transform:scale(1.08); }
    #mic-btn { background:var(--bg-input); border:1px solid var(--border); color:var(--muted); }
    #mic-btn:hover { border-color:var(--cyan); color:var(--cyan); }
    #mic-btn.rec { background:var(--red); border-color:var(--red); color:#fff; animation:rpulse .7s ease infinite; }
    @keyframes rpulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4)} 50%{box-shadow:0 0 0 8px rgba(239,68,68,0)} }

    /* ═══════════════════════════════════════════════════════
       MODAL
    ═══════════════════════════════════════════════════════ */
    .overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.65);
      display:flex; align-items:center; justify-content:center; z-index:100;
      opacity:0; pointer-events:none; transition:opacity .2s;
    }
    .overlay.open { opacity:1; pointer-events:auto; }
    .modal {
      background:#0b1630; border:1px solid var(--border); border-radius:var(--radius);
      padding:20px 22px; width:min(400px,90vw);
      display:flex; flex-direction:column; gap:12px; backdrop-filter:blur(20px);
    }
    .modal h3 { font-size:.95rem; font-weight:600; color:var(--cyan); }
    .fld label { display:block; font-size:.74rem; color:var(--muted); margin-bottom:3px; font-weight:500; }
    .fld input {
      width:100%; background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius-sm);
      color:var(--text); font-family:inherit; font-size:.83rem; padding:7px 11px; outline:none;
    }
    .fld input:focus { border-color:var(--cyan); }
    .ma { display:flex; gap:7px; justify-content:flex-end; }
    .btn-g { background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--muted); cursor:pointer; font-family:inherit; font-size:.83rem; padding:6px 13px; }
    .btn-p { background:var(--btn-grad); border:none; border-radius:var(--radius-sm); color:#fff; cursor:pointer; font-family:inherit; font-size:.83rem; font-weight:600; padding:6px 15px; }
    .cors-note { font-size:.72rem; color:var(--muted); line-height:1.5; background:rgba(0,212,255,0.05); border:1px dashed var(--border); border-radius:var(--radius-sm); padding:7px 10px; }
    .cors-note code { color:var(--cyan); font-family:monospace; font-size:.85em; }

    /* ═══════════════════════════════════════════════════════
       TOAST
    ═══════════════════════════════════════════════════════ */
    .toast {
      position:fixed; bottom:72px; left:50%; transform:translateX(-50%);
      background:#1e293b; border:1px solid var(--border); border-radius:20px;
      color:var(--text); font-size:.8rem; padding:7px 15px; z-index:200;
      opacity:0; pointer-events:none; transition:opacity .25s; white-space:nowrap;
    }
    .toast.show { opacity:1; }

    /* responsive */
    @media(max-width:480px) {
      .actions { grid-template-columns:repeat(2,1fr); }
      .bubble { max-width:82%; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ── HEADER ────────────────────────────────────────── -->
  <header>
    <div class="logo">
      <div class="logo-icon">🥦</div>
      PantryPilot
      <span style="font-size:.68rem;font-weight:400;color:var(--muted);margin-left:2px">Alexa+ Simulator</span>
    </div>
    <div class="status">
      <div class="dot" id="sdot"></div>
      <span id="stxt">Connecting…</span>
    </div>
    <div class="hdr-btns">
      <button class="ico" id="settings-btn" title="Settings">⚙️</button>
      <button class="ico" id="clear-btn"    title="Clear chat">🗑</button>
    </div>
  </header>

  <!-- ── MAIN ──────────────────────────────────────────── -->
  <main>

    <!-- Alexa ring -->
    <div class="ring-wrap">
      <div class="alexa-ring" id="ring">
        <div class="r-bg"></div>
        <div class="r-spin"></div>
        <div class="r-spin2"></div>
        <div class="r-glow"></div>
        <div class="r-icon">🎙️</div>
      </div>
      <div class="ring-label" id="ring-label">Ready</div>
    </div>

    <!-- Chat -->
    <div class="chat" id="chat"></div>

    <!-- Quick actions -->
    <div class="actions">
      <button class="qa" onclick="qa('list_pantry')">
        <span class="qi">📦</span>List Pantry
      </button>
      <button class="qa" onclick="qa('expiring_soon')">
        <span class="qi">⏰</span>Expiring Soon
      </button>
      <button class="qa" onclick="qa('suggest_recipe')">
        <span class="qi">👨‍🍳</span>Suggest Recipe
      </button>
      <button class="qa" onclick="qa('get_shopping_list')">
        <span class="qi">🛒</span>Shopping List
      </button>
      <button class="qa" onclick="qa('weekly_meal_plan')">
        <span class="qi">📅</span>Weekly Plan
      </button>
      <button class="qa" onclick="qa('waste_report')">
        <span class="qi">📊</span>Waste Report
      </button>
    </div>

  </main>

  <!-- ── BOTTOM ─────────────────────────────────────────── -->
  <div class="bottom">

    <!-- Form toggles -->
    <div class="ftoggle-row">
      <button class="ftgl" id="tadd"  onclick="tf('add')">➕ Add Item</button>
      <button class="ftgl" id="tuse"  onclick="tf('use')">➖ Use Item</button>
      <button class="ftgl" id="tshop" onclick="tf('shop')">🛒 Add to List</button>
    </div>

    <!-- Add item -->
    <div class="fpanel" id="fadd">
      <input id="an" placeholder="Item name" />
      <input id="aq" placeholder="Qty" type="number" min="0.1" step="0.1" value="1" style="max-width:65px" />
      <input id="au" placeholder="Unit" value="pcs" style="max-width:60px" />
      <input id="ad" placeholder="Expires in (days)" type="number" min="1" style="max-width:130px" />
      <button class="fsbmt" onclick="doAdd()">Add</button>
    </div>

    <!-- Use item -->
    <div class="fpanel" id="fuse">
      <input id="un" placeholder="Item name" />
      <input id="uq" placeholder="Qty" type="number" min="0.1" step="0.1" value="1" style="max-width:65px" />
      <button class="fsbmt" onclick="doUse()">Use</button>
    </div>

    <!-- Shopping list -->
    <div class="fpanel" id="fshop">
      <input id="sn" placeholder="Item name" />
      <input id="sq" placeholder="Qty" type="number" min="0.1" step="0.1" value="1" style="max-width:65px" />
      <input id="su" placeholder="Unit" value="pcs" style="max-width:60px" />
      <button class="fsbmt" onclick="doShop()">Add to List</button>
    </div>

    <!-- Text + voice input -->
    <div class="ibar">
      <input id="cmd"
             placeholder='Try "add 6 eggs expire 10 days" or "what can I cook tonight?"'
             autocomplete="off" spellcheck="false" />
      <button class="ibtn" id="mic-btn" title="Voice input">🎤</button>
      <button class="ibtn" id="send-btn" title="Send">➤</button>
    </div>

  </div>
</div>

<!-- ── SETTINGS MODAL ──────────────────────────────────── -->
<div class="overlay" id="settings-overlay">
  <div class="modal">
    <h3>⚙️ Simulator Settings</h3>
    <div class="fld">
      <label>MCP Server URL</label>
      <input id="s-url" placeholder="http://localhost:8000/mcp" />
    </div>
    <div class="fld">
      <label>API Key (MCP_API_KEY) — leave blank if not set</label>
      <input id="s-key" type="password" placeholder="optional" />
    </div>
    <div class="cors-note">
      💡 Start the server with:<br/>
      <code>.venv\Scripts\python server.py</code><br/>
      CORS is enabled automatically so this page can connect from <code>file://</code>.
    </div>
    <div class="ma">
      <button class="btn-g" onclick="closeSettings()">Cancel</button>
      <button class="btn-p" onclick="saveSettings()">Save & reconnect</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ─── State ──────────────────────────────────────────── */
let URL = localStorage.getItem('pp_url') || 'http://localhost:8000/mcp';
let KEY = localStorage.getItem('pp_key') || '';
let rid = 1;
let rec = null;
let recActive = false;

/* ─── Boot ───────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', () => {
  initVoice();
  probe();
  alexaSay("Hello! I'm PantryPilot. Tap a quick action or describe what you'd like to do.");
  document.getElementById('cmd').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  document.getElementById('send-btn').addEventListener('click', send);
  document.getElementById('mic-btn').addEventListener('click', toggleMic);
  document.getElementById('settings-btn').addEventListener('click', openSettings);
  document.getElementById('clear-btn').addEventListener('click', clearChat);
  document.getElementById('settings-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('settings-overlay')) closeSettings();
  });
});

/* ─── Server probe ───────────────────────────────────── */
async function probe() {
  const dot  = document.getElementById('sdot');
  const txt  = document.getElementById('stxt');
  try {
    const r = await fetch(URL, {
      method:'POST', headers:hdrs(),
      body: JSON.stringify({ jsonrpc:'2.0', id:rid++, method:'tools/list' })
    });
    if (r.ok || r.status === 200) {
      dot.className='dot on'; txt.textContent='Connected';
    } else { throw r.status; }
  } catch {
    dot.className='dot off'; txt.textContent='Server offline';
  }
}

/* ─── MCP call ───────────────────────────────────────── */
function hdrs() {
  const h = { 'Content-Type':'application/json', 'Accept':'application/json' };
  if (KEY) h['Authorization'] = `Bearer ${KEY}`;
  return h;
}

async function call(name, args={}) {
  const r = await fetch(URL, {
    method:'POST', headers:hdrs(),
    body: JSON.stringify({ jsonrpc:'2.0', id:rid++,
                           method:'tools/call', params:{ name, arguments:args } })
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  if (d.error) throw new Error(d.error.message || JSON.stringify(d.error));
  if (d.result?.isError) throw new Error(d.result.content?.[0]?.text || 'Tool error');
  return d.result?.content?.[0]?.text ?? JSON.stringify(d.result);
}

/* ─── Quick actions ──────────────────────────────────── */
const LABELS = {
  list_pantry:'List pantry', expiring_soon:"What's expiring soon?",
  suggest_recipe:'Suggest a recipe', get_shopping_list:'Show shopping list',
  weekly_meal_plan:'Plan my week', waste_report:'Show waste report (7 days)'
};

async function qa(tool) {
  userSay(LABELS[tool] || tool);
  ring('speaking'); setLabel('Thinking…');
  const t = typing();
  try { const r = await call(tool); rm(t); alexaSay(r); probe(); }
  catch(e){ rm(t); alexaSay(oops(e)); }
  ring(); setLabel('Ready');
}

/* ─── Form submissions ───────────────────────────────── */
async function doAdd() {
  const name = v('an');
  const qty  = f('aq', 1);
  const unit = v('au') || 'pcs';
  const days = p('ad');
  if (!name) { toast('Enter an item name'); return; }
  const lbl  = days ? `Add ${qty} ${unit} of ${name}, expires in ${days} days`
                    : `Add ${qty} ${unit} of ${name}`;
  userSay(lbl); ring('speaking'); setLabel('Adding…');
  const t = typing();
  try {
    const args = { name, quantity:qty, unit };
    if (days) args.days_until_expiry = days;
    const r = await call('add_item', args);
    rm(t); alexaSay(r);
    el('an').value=''; el('ad').value='';
  } catch(e){ rm(t); alexaSay(oops(e)); }
  ring(); setLabel('Ready');
}

async function doUse() {
  const name = v('un');
  const qty  = f('uq', 1);
  if (!name) { toast('Enter an item name'); return; }
  userSay(`Use ${qty} of ${name}`); ring('speaking'); setLabel('Updating…');
  const t = typing();
  try {
    const r = await call('use_item', { name, quantity:qty });
    rm(t); alexaSay(r); el('un').value='';
  } catch(e){ rm(t); alexaSay(oops(e)); }
  ring(); setLabel('Ready');
}

async function doShop() {
  const name = v('sn');
  const qty  = f('sq', 1);
  const unit = v('su') || 'pcs';
  if (!name) { toast('Enter an item name'); return; }
  userSay(`Add ${qty} ${unit} of ${name} to shopping list`);
  ring('speaking'); setLabel('Adding to list…');
  const t = typing();
  try {
    const r = await call('add_to_shopping_list', { name, quantity:qty, unit });
    rm(t); alexaSay(r); el('sn').value='';
  } catch(e){ rm(t); alexaSay(oops(e)); }
  ring(); setLabel('Ready');
}

/* ─── NL → tool parser ───────────────────────────────── */
async function send() {
  const inp = el('cmd');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = '';
  userSay(txt); ring('speaking'); setLabel('Thinking…');
  const t = typing();
  try {
    const { tool, args } = parse(txt.toLowerCase());
    const r = await call(tool, args);
    rm(t); alexaSay(r); probe();
  } catch(e) {
    rm(t);
    if (/fetch|network|cors/i.test(e.message))
      alexaSay('Cannot reach the server. Run: .venv\\Scripts\\python server.py — then refresh.');
    else alexaSay(oops(e));
  }
  ring(); setLabel('Ready');
}

function parse(t) {
  if (/week|meal plan/.test(t))
    return { tool:'weekly_meal_plan', args:{} };
  if (/waste|report|consumed/.test(t)) {
    const d = t.match(/(\d+)\s*day/);
    return { tool:'waste_report', args: d ? {days:+d[1]} : {} };
  }
  if (/expir|expire|going bad|use soon/.test(t)) {
    const d = t.match(/(\d+)\s*day/);
    return { tool:'expiring_soon', args: d ? {days:+d[1]} : {} };
  }
  if (/recipe|cook|make|tonight|dinner|lunch|eat/.test(t)) {
    const mood = t.replace(/(recipe|cook|make|tonight|dinner|lunch|eat)/,'').trim();
    return { tool:'suggest_recipe', args: mood ? {mood} : {} };
  }
  if (/shopping list/.test(t) && !/add/.test(t))
    return { tool:'get_shopping_list', args:{} };
  if (/add.*shopping|shopping.*add/.test(t)) {
    const m = t.match(/(\d+(?:\.\d+)?)\s*(\w+)?\s+(?:of\s+)?(\w[\w\s]*?)(?:\s+to|\s*$)/);
    if (m) return { tool:'add_to_shopping_list',
                    args:{ name:m[3].trim(), quantity:+m[1], unit:m[2]||'pcs' } };
  }
  if (/list|pantry|have|stock/.test(t))
    return { tool:'list_pantry', args:{} };
  if (/use|used|finish|consume/.test(t)) {
    const m = t.match(/(?:use|used|finish|consume)\s+(\d+(?:\.\d+)?)?\s*(?:of\s+)?(\w[\w\s]*)/);
    if (m) return { tool:'use_item', args:{ name:m[2].trim(), quantity:m[1]?+m[1]:1 } };
  }
  if (/add|bought|got|purchase/.test(t)) {
    const qty  = (t.match(/(\d+(?:\.\d+)?)/) || [])[1];
    const days = (t.match(/expir\w*\s*i?n?\s*(\d+)/) || [])[1];
    const name = t.replace(/add|bought|got|purchase/g,'')
                  .replace(/\d+(?:\.\d+)?/,'')
                  .replace(/expir\w*\s*i?n?\s*\d+\s*days?/,'')
                  .replace(/\b(pcs|kg|g|litre|liter|bottle|can|bag|box|pack|cup|cups)\b/,'')
                  .trim();
    if (name) {
      const a = { name, quantity: qty ? +qty : 1 };
      if (days) a.days_until_expiry = +days;
      return { tool:'add_item', args:a };
    }
  }
  return { tool:'suggest_recipe', args:{ mood:t } };
}

/* ─── Chat helpers ───────────────────────────────────── */
const chat = () => document.getElementById('chat');
function userSay(txt) {
  chat().insertAdjacentHTML('beforeend',
    `<div class="msg user"><div class="bubble">${esc(txt)}</div>
     <div class="av">👤</div></div>`);
  scroll();
}
function alexaSay(txt) {
  chat().insertAdjacentHTML('beforeend',
    `<div class="msg alexa"><div class="av">🤖</div>
     <div class="bubble">${esc(txt)}</div></div>`);
  scroll();
}
function typing() {
  const id = 'tp'+Date.now();
  chat().insertAdjacentHTML('beforeend',
    `<div class="msg alexa" id="${id}"><div class="av">🤖</div>
     <div class="bubble"><span class="dots"><span></span><span></span><span></span></span></div></div>`);
  scroll(); return id;
}
function rm(id)    { document.getElementById(id)?.remove(); }
function scroll()  { chat().scrollTop = chat().scrollHeight; }
function clearChat(){ chat().innerHTML=''; alexaSay('Chat cleared. What would you like to do?'); }
function esc(s)    { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function oops(e)   { const m=e?.message||String(e); return m.length<120 ? 'Sorry — '+m : 'Something went wrong. Please try again.'; }

/* ─── Alexa ring ─────────────────────────────────────── */
function ring(state='') {
  document.getElementById('ring').className = 'alexa-ring' + (state?' '+state:'');
}
function setLabel(txt) { document.getElementById('ring-label').textContent = txt; }

/* ─── Form toggles ───────────────────────────────────── */
function tf(which) {
  ['add','use','shop'].forEach(k => {
    const open = k===which && !document.getElementById('f'+k).classList.contains('open');
    document.getElementById('f'+k).classList.toggle('open', open);
    document.getElementById('t'+k).classList.toggle('on',   open);
  });
}

/* ─── Voice input ────────────────────────────────────── */
function initVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = document.getElementById('mic-btn');
  if (!SR) { btn.style.opacity='.35'; btn.title='Voice not available in this browser'; return; }
  rec = new SR(); rec.lang='en-US'; rec.interimResults=false;
  rec.onresult = e => {
    el('cmd').value = e.results[0][0].transcript;
    send();
  };
  rec.onend = () => { recActive=false; btn.classList.remove('rec'); ring(); setLabel('Ready'); };
  rec.onerror = e => {
    recActive=false; btn.classList.remove('rec'); ring(); setLabel('Ready');
    if (e.error!=='no-speech') toast('Voice error: '+e.error);
  };
}
function toggleMic() {
  if (!rec) { toast('Voice not available in this browser'); return; }
  const btn = document.getElementById('mic-btn');
  if (recActive) { rec.stop(); }
  else { rec.start(); recActive=true; btn.classList.add('rec'); ring('listening'); setLabel('Listening…'); }
}

/* ─── Settings ───────────────────────────────────────── */
function openSettings() {
  el('s-url').value = URL; el('s-key').value = KEY;
  el('settings-overlay').classList.add('open');
}
function closeSettings() { el('settings-overlay').classList.remove('open'); }
function saveSettings() {
  URL = el('s-url').value.trim() || 'http://localhost:8000/mcp';
  KEY = el('s-key').value.trim();
  localStorage.setItem('pp_url', URL); localStorage.setItem('pp_key', KEY);
  closeSettings(); probe(); toast('Settings saved ✓');
}

/* ─── Toast ──────────────────────────────────────────── */
let tt;
function toast(m) {
  const t=el('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),3000);
}

/* ─── Utils ──────────────────────────────────────────── */
function el(id)     { return document.getElementById(id); }
function v(id)      { return el(id).value.trim(); }
function f(id,def)  { return parseFloat(el(id).value)||def; }
function p(id)      { return parseInt(el(id).value)||null; }
</script>
